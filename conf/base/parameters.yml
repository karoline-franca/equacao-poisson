simulation:
  n_cargas: 2000

intervals:
  parametro_eps0: 8.8541878128e-12

densidade_carga:
  # tipo: senoide
  # parametros:
  #   amplitude_fator: 7.402203300817018     # A = fator × ε₀  (fator = 3π²/4)
  #   n: 1
  #   m: 1
  #   l: 1

  tipo: gaussiana
  parametros:
    amplitude_min:  10.0e-2
    amplitude_max: 100.0e-2
    largura_min:     0.08
    largura_max:     0.25
    centro_x_min:   -0.5
    centro_x_max:    0.5
    centro_y_min:   -0.5
    centro_y_max:    0.5

  # tipo: gaussiana_dupla
  # parametros:
  #   A1: 1.0e-10
  #   A2: -0.8e-10
  #   sigma1: 0.15
  #   sigma2: 0.10
  #   c1: [0.3, -0.2, 0.4]
  #   c2: [-0.4, 0.3, -0.2]

solver:
  N: 20
  dominio:
    xmin: -1.0
    xmax: 1.0
    ymin: -1.0
    ymax: 1.0

seed: 42

mlp:
  hidden_dims: [64, 128]            # camadas ocultas
  activation: "relu"                # função de ativação
  batch_size: 32                    # tamanho do batch
  epochs: 150                       # número de épocas
  learning_rate: 0.001              # taxa de aprendizado
  weight_decay: 0.001               # regularização L2