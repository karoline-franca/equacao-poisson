# ============================================================
# PIPELINE P00 - GERAÇÃO DE BASES DE DADOS
# ============================================================

distribuicoes_carga:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/${runtime_params:data_version,default_v1}/distribuicoes_carga.csv
  load_args:
    sep: ';'
    encoding: 'latin-1'
  save_args:
    index: False
    sep: ';'
    encoding: 'latin-1'

parametros_eletrostatico:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/${runtime_params:data_version,default_v1}/parametros_eletrostatico.csv
  load_args:
    sep: ';'
    encoding: 'latin-1'
  save_args:
    index: False
    sep: ';'
    encoding: 'latin-1'

solucao_espectral:
  type: pickle.PickleDataset
  filepath: data/03_primary/${runtime_params:data_version,default_v1}/solucao_espectral.pkl

base_eletrostatica:
  type: pandas.CSVDataset
  filepath: data/04_feature/${runtime_params:data_version,default_v1}/base_poisson.csv
  load_args:
    sep: ';'
    encoding: 'latin-1'
    dtype:
      densidade_carga: float64
      potencial: float64
  save_args:
    index: False
    sep: ';'
    encoding: 'latin-1'
    float_format: '%.15e'

metadata_simulacao:
  type: json.JSONDataset
  filepath: data/04_feature/${runtime_params:data_version,default_v1}/metadata_simulacao.json
  save_args:
    indent: 2

# ============================================================
# PIPELINE P01 - TREINAMENTO MLP
# ============================================================

X_train:
  type: pickle.PickleDataset
  filepath: data/06_models/${runtime_params:exp_name,default_exp}/${runtime_params:data_version,default_v1}/X_train.pkl

y_train:
  type: pickle.PickleDataset
  filepath: data/06_models/${runtime_params:exp_name,default_exp}/${runtime_params:data_version,default_v1}/y_train.pkl

X_val:
  type: pickle.PickleDataset
  filepath: data/06_models/${runtime_params:exp_name,default_exp}/${runtime_params:data_version,default_v1}/X_val.pkl

y_val:
  type: pickle.PickleDataset
  filepath: data/06_models/${runtime_params:exp_name,default_exp}/${runtime_params:data_version,default_v1}/y_val.pkl

X_test:
  type: pickle.PickleDataset
  filepath: data/06_models/${runtime_params:exp_name,default_exp}/${runtime_params:data_version,default_v1}/X_test.pkl

y_test:
  type: pickle.PickleDataset
  filepath: data/06_models/${runtime_params:exp_name,default_exp}/${runtime_params:data_version,default_v1}/y_test.pkl

scaler_X:
  type: pickle.PickleDataset
  filepath: data/06_models/${runtime_params:exp_name,default_exp}/${runtime_params:data_version,default_v1}/scaler_X.pkl

scaler_y:
  type: pickle.PickleDataset
  filepath: data/06_models/${runtime_params:exp_name,default_exp}/${runtime_params:data_version,default_v1}/scaler_y.pkl

modelo_mlp:
  type: pickle.PickleDataset
  filepath: data/07_model_output/${runtime_params:exp_name,default_exp}/${runtime_params:data_version,default_v1}/mlp_model.pth

modelo_mlp_treinado:
  type: pickle.PickleDataset
  filepath: data/07_model_output/${runtime_params:exp_name,default_exp}/${runtime_params:data_version,default_v1}/mlp_model_trained.pth

history_mlp:
  type: pickle.PickleDataset
  filepath: data/07_model_output/${runtime_params:exp_name,default_exp}/${runtime_params:data_version,default_v1}/mlp_history.pkl

metricas_mlp:
  type: json.JSONDataset
  filepath: data/08_reporting/${runtime_params:data_version,default_v1}/metricas_mlp.json

input_dim:
  type: MemoryDataset

output_dim:
  type: MemoryDataset

num_pontos:
  type: MemoryDataset

cargas_train:
  type: MemoryDataset

cargas_val:
  type: MemoryDataset

cargas_test:
  type: MemoryDataset

