# ============================================================
# PIPELINE P00 - GERAÇÃO DE BASES DE DADOS
# ============================================================

distribuicoes_carga:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/${runtime_params:data_version,default_v1}/distribuicoes_carga.parquet

parametros_eletrostatico:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/${runtime_params:data_version,default_v1}/parametros_eletrostatico.parquet

solucao_espectral:
  type: pickle.PickleDataset
  filepath: data/03_primary/${runtime_params:data_version,default_v1}/solucao_espectral.pkl

base_eletrostatica:
  type: pandas.ParquetDataset
  filepath: data/04_feature/${runtime_params:data_version,default_v1}/base_poisson.parquet
  load_args:
    columns:
      - carga_id
      - x_col
      - y_col
      - x
      - y
      - densidade_carga
      - potencial
      - amplitude
      - largura
      - centro_x
      - centro_y

metadata_simulacao:
  type: json.JSONDataset
  filepath: data/04_feature/${runtime_params:data_version,default_v1}/metadata_simulacao.json
  save_args:
    indent: 2

